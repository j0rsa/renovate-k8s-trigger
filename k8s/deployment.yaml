# Kubernetes Secret holding the API token.
# Generate a strong random value and replace <base64-encoded-secret> below:
#   echo -n "$(openssl rand -hex 32)" | base64
apiVersion: v1
kind: Secret
metadata:
  name: renovate-k8s-trigger-secret
  namespace: renovate-trigger
type: Opaque
data:
  api-secret: <base64-encoded-secret>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: renovate-k8s-trigger
  namespace: renovate-trigger
  labels:
    app: renovate-k8s-trigger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: renovate-k8s-trigger
  template:
    metadata:
      labels:
        app: renovate-k8s-trigger
    spec:
      serviceAccountName: renovate-k8s-trigger
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: renovate-k8s-trigger
          image: ghcr.io/j0rsa/renovate-k8s-trigger:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: API_SECRET
              valueFrom:
                secretKeyRef:
                  name: renovate-k8s-trigger-secret
                  key: api-secret
            - name: CRON_JOB_NAME
              value: "renovate"   # replace with your CronJob name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: "info"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      restartPolicy: Always
