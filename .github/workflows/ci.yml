name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BIN_NAME: renovate-k8s-trigger

jobs:
  # ── Version guard (main push only) ──────────────────────────────────────────
  # Cargo.toml version drives GHCR tags (vX.Y.Z). Refuse to republish an existing tag.
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: ver
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: v${VERSION}"

      - name: Check tag does not already exist in GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.repository }}" | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://ghcr.io/v2/${OWNER}/${REPO}/manifests/v${VERSION}")
          if [ "$STATUS" = "200" ]; then
            echo "::error::Tag v${VERSION} already exists in GHCR. Bump the version in Cargo.toml before merging."
            exit 1
          fi
          echo "Tag v${VERSION} is free — proceeding."

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: version-check
    if: always() && !failure() && !cancelled()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: version-check
    if: always() && !failure() && !cancelled()
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run tests
        run: cargo test --locked

  # ── Native release builds (no QEMU) ─────────────────────────────────────────
  build-amd64:
    name: Build amd64
    needs: [lint, test]
    if: always() && needs.lint.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: amd64

      - name: Build release binary
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-amd64
          path: target/x86_64-unknown-linux-musl/release/${{ env.BIN_NAME }}
          retention-days: 1

  build-arm64:
    name: Build arm64
    needs: [lint, test]
    if: always() && needs.lint.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: arm64

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-unknown-linux-musl

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-arm64
          path: target/aarch64-unknown-linux-musl/release/${{ env.BIN_NAME }}
          retention-days: 1

  # ── Thin multi-arch image from prebuilt binaries ────────────────────────────
  # Tags come from Cargo.toml version (petmon-style):
  #   main push → vX.Y.Z, sha-<short>, latest
  #   PR        → pr-<n>-<version>-<sha> (build only, no push)
  docker:
    name: Docker multiarch image
    needs: [build-amd64, build-arm64, version-check]
    if: |
      always() &&
      needs.build-amd64.result == 'success' &&
      needs.build-arm64.result == 'success' &&
      !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract app version
        id: ver
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-amd64
          path: dist/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-arm64
          path: dist/arm64

      - name: Make binaries executable
        run: chmod +x dist/amd64/${{ env.BIN_NAME }} dist/arm64/${{ env.BIN_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Local tag generation avoids docker/metadata-action GitHub API calls,
      # which fail hard on transient 503 unicorn responses.
      - name: Extract metadata
        id: meta
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          # GHCR requires lowercase image names
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          VERSION="${{ steps.ver.outputs.version }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHORT_SHA="$(printf '%.7s' '${{ github.event.pull_request.head.sha }}')"
          else
            SHORT_SHA="$(printf '%.7s' '${{ github.sha }}')"
          fi

          TAGS=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAGS+=("${IMAGE}:pr-${{ github.event.pull_request.number }}-${VERSION}-${SHORT_SHA}")
          elif [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ github.event_name }}" = "push" ]; then
            TAGS+=("${IMAGE}:v${VERSION}")
            TAGS+=("${IMAGE}:sha-${SHORT_SHA}")
            TAGS+=("${IMAGE}:latest")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Image tags:"
          printf '  %s\n' "${TAGS[@]}"

      # Multi-arch requires an explicit output when not pushing (docker-container driver).
      - name: Build multiarch image (no push)
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          outputs: type=oci,dest=/tmp/renovate-k8s-trigger.oci.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push multiarch image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
